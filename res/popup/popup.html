<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Caption Wordinizer</title>
    <link rel="stylesheet" href="../fonts/fonts.css">
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="header">
    <img class="logo" src="../icons/icon128.png" alt="">
    <span class="brand">Caption Wordinizer</span>
    <div class="lang-switch" role="group" aria-label="UI language">
        <button type="button" data-ui-lang="zh-TW">中</button>
        <button type="button" data-ui-lang="en">EN</button>
    </div>
    <label class="switch">
        <input type="checkbox" id="enabled" data-i18n-label="enable">
        <span class="track"></span>
    </label>
</header>

<nav class="tabs" role="tablist">
    <button type="button" class="tab" role="tab" data-tab="settings" data-i18n="settingsTab"></button>
    <button type="button" class="tab" role="tab" data-tab="cards"><span data-i18n="cardsTab"></span> · <span id="cardCount">0</span></button>
</nav>

<!-- 2a 設定 -->
<section class="view" data-view="settings">
    <div class="rows">
        <div class="row">
            <span data-i18n="showTranslation"></span>
            <label class="switch">
                <input type="checkbox" id="showTranslation" data-i18n-label="showTranslation">
                <span class="track"></span>
            </label>
        </div>
        <div class="row">
            <span data-i18n="sentenceSplit"></span>
            <label class="switch">
                <input type="checkbox" id="sentenceSplit" data-i18n-label="sentenceSplit">
                <span class="track"></span>
            </label>
        </div>
        <div class="row">
            <span data-i18n="tokenUnit"></span>
            <div class="seg" id="tokenUnit">
                <label class="seg-opt"><input type="radio" name="tokenUnit" value="word"><span data-i18n="unitWord"></span></label>
                <label class="seg-opt"><input type="radio" name="tokenUnit" value="stem"><span data-i18n="unitStem"></span></label>
                <label class="seg-opt"><input type="radio" name="tokenUnit" value="phrase"><span data-i18n="unitPhrase"></span></label>
            </div>
        </div>
        <div class="row">
            <span data-i18n="targetLang"></span>
            <div class="seg" id="targetLang"></div>
        </div>
        <div class="row">
            <span data-i18n="engine"></span>
            <div class="seg" id="translateProvider">
                <label class="seg-opt"><input type="radio" name="translateProvider" value="google"><span data-i18n="google"></span></label>
                <label class="seg-opt"><input type="radio" name="translateProvider" value="gemini">Gemini</label>
                <label class="seg-opt"><input type="radio" name="translateProvider" value="nvidia">NVIDIA</label>
                <label class="seg-opt"><input type="radio" name="translateProvider" value="groq">Groq</label>
            </div>
        </div>
    </div>

    <div class="section">
        <h2 data-i18n="captionHead"></h2>
        <div class="rows">
            <div class="row">
                <span data-i18n="captionPosition"></span>
                <div class="seg" id="captionPosition">
                    <label class="seg-opt"><input type="radio" name="captionPosition" value="bottom"><span data-i18n="captionBottom"></span></label>
                    <label class="seg-opt"><input type="radio" name="captionPosition" value="top"><span data-i18n="captionTop"></span></label>
                </div>
            </div>
            <div class="row">
                <label for="captionOffset" data-i18n="captionOffset"></label>
                <div class="range-field">
                    <input type="range" id="captionOffset" min="0" max="50" step="1">
                    <output id="captionOffsetValue" for="captionOffset"></output>
                </div>
            </div>
            <div class="row">
                <label for="captionSize" data-i18n="captionSize"></label>
                <div class="range-field">
                    <input type="range" id="captionSize" min="70" max="200" step="10">
                    <output id="captionSizeValue" for="captionSize"></output>
                </div>
            </div>
        </div>
    </div>

    <div class="section">
        <h2 data-i18n="geminiHead"></h2>
        <div class="field">
            <label for="geminiApiKey">API Key<span data-i18n="keyHint"></span></label>
            <input class="input" type="password" id="geminiApiKey" placeholder="AIza..." autocomplete="off">
        </div>
        <div class="field">
            <label for="geminiModel" data-i18n="model"></label>
            <input class="input" type="text" id="geminiModel">
        </div>
    </div>

    <div class="section">
        <h2 data-i18n="nvidiaHead"></h2>
        <div class="field">
            <label for="nvidiaApiKey">API Key<span data-i18n="keyHint"></span></label>
            <input class="input" type="password" id="nvidiaApiKey" placeholder="nvapi-..." autocomplete="off">
        </div>
        <div class="field">
            <label for="nvidiaModel" data-i18n="model"></label>
            <input class="input" type="text" id="nvidiaModel">
        </div>
    </div>

    <div class="section">
        <h2 data-i18n="groqHead"></h2>
        <div class="field">
            <label for="groqApiKey">API Key<span data-i18n="keyHint"></span></label>
            <input class="input" type="password" id="groqApiKey" placeholder="gsk_..." autocomplete="off">
        </div>
        <div class="field">
            <label for="groqModel" data-i18n="model"></label>
            <input class="input" type="text" id="groqModel">
        </div>
    </div>

    <div class="section">
        <h2 data-i18n="posHead"></h2>
        <div class="pos-grid" id="posLabels"></div>
    </div>
</section>

<!-- 1h 單字卡 -->
<section class="view" data-view="cards">
    <div class="regen">
        <div class="row">
            <span><span data-i18n="failedCards"></span><span id="failedCount">0</span></span>
            <button type="button" class="btn btn-ghost" id="regenerateBtn" data-i18n="regenerate"></button>
        </div>
        <p class="hint" id="regenerateStatus" hidden></p>
    </div>
    <p class="hint" id="cardsEmpty" data-i18n="cardsHint"></p>
    <div class="card-list" id="cardList"></div>
    <div class="footer">
        <button type="button" class="btn btn-primary" id="exportBtn"><span class="btn-icon" data-icon="download"></span><span data-i18n="export"></span></button>
        <button type="button" class="btn btn-ghost" id="clearBtn" data-i18n="clear"></button>
    </div>
</section>

<!-- 點單字卡後跳出的完整預覽卡（和影片上的 1d 同一個樣式） -->
<div class="card-modal" id="cardModal" hidden></div>

<script type="module" src="popup.js"></script>
</body>
</html>
