<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Caption Wordinizer</title>
    <link rel="stylesheet" href="../fonts/fonts.css">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="header">
    <img class="logo" src="../icons/icon128.png" alt="">
    <span class="brand">Caption Wordinizer</span>
    <div class="lang-switch" role="group" aria-label="UI language">
        <button type="button" data-ui-lang="zh-TW">中</button>
        <button type="button" data-ui-lang="en">EN</button>
    </div>
    <label class="switch">
        <input type="checkbox" id="enabled" data-i18n-label="enable">
        <span class="track"></span>
    </label>
</header>

<nav class="tabs" role="tablist">
    <button type="button" class="tab" role="tab" data-tab="settings" data-i18n="settingsTab"></button>
    <button type="button" class="tab" role="tab" data-tab="cards"><span data-i18n="cardsTab"></span> · <span id="cardCount">0</span></button>
</nav>

<!-- 2a 設定 -->
<section class="view" data-view="settings">
    <div class="rows">
        <div class="row">
            <span data-i18n="showTranslation"></span>
            <label class="switch">
                <input type="checkbox" id="showTranslation" data-i18n-label="showTranslation">
                <span class="track"></span>
            </label>
        </div>
        <div class="row">
            <span data-i18n="targetLang"></span>
            <div class="seg" id="targetLang"></div>
        </div>
        <div class="row">
            <span data-i18n="engine"></span>
            <div class="seg" id="translateProvider">
                <label class="seg-opt"><input type="radio" name="translateProvider" value="google"><span data-i18n="google"></span></label>
                <label class="seg-opt"><input type="radio" name="translateProvider" value="gemini">Gemini</label>
            </div>
        </div>
    </div>

    <div class="section">
        <h2 data-i18n="geminiHead"></h2>
        <div class="field">
            <label for="geminiApiKey">API Key<span data-i18n="keyHint"></span></label>
            <input class="input" type="password" id="geminiApiKey" placeholder="AIza..." autocomplete="off">
        </div>
        <div class="field">
            <label for="geminiModel" data-i18n="model"></label>
            <input class="input" type="text" id="geminiModel">
        </div>
    </div>

    <div class="section">
        <h2 data-i18n="posHead"></h2>
        <div class="pos-grid" id="posLabels"></div>
    </div>
</section>

<!-- 1h 單字卡 -->
<section class="view" data-view="cards">
    <p class="hint" id="cardsEmpty" data-i18n="cardsHint"></p>
    <div class="card-list" id="cardList"></div>
    <div class="footer">
        <button type="button" class="btn btn-primary" id="exportBtn"><span class="btn-icon" data-icon="download"></span><span data-i18n="export"></span></button>
        <button type="button" class="btn btn-ghost" id="clearBtn" data-i18n="clear"></button>
    </div>
</section>

<script type="module" src="popup.js"></script>
</body>
</html>
